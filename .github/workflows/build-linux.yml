name: Build Linux AppImage

# Roda quando uma Release é publicada (ex.: pelo "Publicar Atualizacao.bat")
# e anexa o TelaCompartilhada.AppImage na mesma Release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.5.2)'
        required: true

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build-linux

      - name: Anexar AppImage na Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/TelaCompartilhada.AppImage --clobber
